spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/littera
spring.datasource.username=postgres
spring.datasource.password=lucas

api.security.token.secret=${JWT_SECRET:my-secret-key}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
server.error.include-stacktrace=always
logging.level.org.springframework.web=DEBUG

apps.cors.origens-oermitidas=${CORS-ORIGENS:http://localhost:5173}

# ========= IA: SPRING AI + OLLAMA =========

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

spring.ai.ollama.chat.model=${OLLAMA_MODEL:llama3.2}

spring.ai.ollama.chat.options.temperature=${OLLAMA_TEMPERATURE:0}

spring.ai.ollama.chat.keep-alive=30m

spring.ai.ollama.init.pull-model-strategy=never